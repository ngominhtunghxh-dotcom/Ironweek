<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronWeek – Lịch Tập Gym</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --card: #1a1a26; --border: #2a2a3e;
    --accent: #f0c040; --accent2: #e05c30; --text: #e8e8f0; --muted: #6b6b88;
    --green: #3ddc84; --blue: #5b8def; --purple: #a06ef0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 60% 40% at 80% 10%, rgba(240,192,64,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 10% 80%, rgba(224,92,48,0.05) 0%, transparent 60%);
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; position: relative; z-index: 1; }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
  .logo-block h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(48px,8vw,88px); line-height: 0.9; letter-spacing: 2px; }
  .logo-block h1 span { color: var(--accent); display: block; }
  .logo-block p { margin-top: 12px; color: var(--muted); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; }
  .header-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .badge { background: var(--card); border: 1px solid var(--border); border-radius: 100px; padding: 6px 16px; font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .badge.highlight { border-color: var(--accent); color: var(--accent); }
  .stats-bar { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 10px; margin-bottom: 32px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: center; }
  .stat-card .sv { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: var(--accent); line-height: 1; }
  .stat-card .sl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 3px; }
  .stat-card.streak .sv { color: var(--accent2); }
  .stat-card.done-w .sv { color: var(--green); }
  .week-selector { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .week-selector label { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .week-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: all .2s; font-family: 'DM Sans', sans-serif; }
  .week-btn:hover { border-color: var(--accent); color: var(--text); }
  .week-label { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--accent); min-width: 160px; text-align: center; }
  .reset-week-btn { margin-left: auto; background: transparent; border: 1px solid rgba(224,92,48,0.3); color: rgba(224,92,48,0.6); border-radius: 8px; padding: 6px 14px; font-size: 11px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: all .2s; font-family: 'DM Sans', sans-serif; }
  .reset-week-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .week-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; overflow-x: auto; padding-bottom: 4px; }
  .week-bar::-webkit-scrollbar { height: 3px; }
  .week-bar::-webkit-scrollbar-track { background: var(--surface); }
  .week-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .day-pill { flex-shrink: 0; padding: 10px 18px; border-radius: 100px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s; letter-spacing: .5px; white-space: nowrap; position: relative; font-family: 'DM Sans', sans-serif; }
  .day-pill:hover { border-color: var(--accent); color: var(--text); }
  .day-pill.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .day-pill.rest { border-color: transparent; background: rgba(255,255,255,0.03); color: var(--muted); font-style: italic; }
  .day-pill.rest.active { background: var(--border); color: var(--text); }
  .day-pill.completed::after { content: '✓'; position: absolute; top: -4px; right: -4px; background: var(--green); color: #000; width: 16px; height: 16px; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .day-card { display: none; animation: fadeUp .35s ease forwards; }
  .day-card.visible { display: block; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .day-header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  .day-number { font-family: 'Bebas Neue', sans-serif; font-size: 72px; line-height: 1; color: var(--accent); opacity: .3; }
  .day-info h2 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 1px; line-height: 1; }
  .muscle-tag { display: inline-block; margin-top: 6px; padding: 4px 12px; border-radius: 4px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
  .tag-chest { background: rgba(91,141,239,0.15); color: var(--blue); }
  .tag-back { background: rgba(160,110,240,0.15); color: var(--purple); }
  .tag-legs { background: rgba(224,92,48,0.15); color: var(--accent2); }
  .tag-shoulder { background: rgba(240,192,64,0.15); color: var(--accent); }
  .tag-rest { background: rgba(107,107,136,0.15); color: var(--muted); }
  .complete-badge { display: none; align-items: center; gap: 8px; background: rgba(61,220,132,0.12); border: 1px solid rgba(61,220,132,0.3); border-radius: 100px; padding: 8px 18px; }
  .complete-badge.show { display: flex; }
  .complete-badge span { font-size: 13px; color: var(--green); font-weight: 600; letter-spacing: .5px; }
  .progress-section { margin-bottom: 28px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; letter-spacing: .5px; }
  .progress-track { height: 6px; background: var(--border); border-radius: 100px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 100px; transition: width .4s ease; }
  .exercise-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .ex-row { background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: grid; grid-template-columns: 32px 1fr auto auto auto; align-items: center; padding: 14px 18px; gap: 12px; transition: all .2s; }
  .ex-row:hover { border-color: rgba(240,192,64,0.3); }
  .ex-row.done { background: rgba(61,220,132,0.05); border-color: rgba(61,220,132,0.2); }
  .ex-num { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); opacity: .5; text-align: center; }
  .ex-name { font-weight: 500; font-size: 15px; }
  .ex-name small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .ex-stat { text-align: center; min-width: 52px; }
  .ex-stat .val { font-family: 'Bebas Neue', sans-serif; font-size: 20px; line-height: 1; }
  .ex-stat .lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
  .ex-check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border); cursor: pointer; transition: all .2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ex-check:hover { border-color: var(--accent); }
  .ex-check.checked { background: var(--green); border-color: var(--green); }
  .ex-check.checked::after { content: '✓'; font-size: 13px; color: #000; font-weight: 700; }
  .tips-box { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 12px; padding: 18px 20px; }
  .tips-box h4 { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .tips-box ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .tips-box ul li { font-size: 13px; color: var(--muted); padding-left: 16px; position: relative; line-height: 1.5; }
  .tips-box ul li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-size: 11px; }
  .rest-content { text-align: center; padding: 60px 20px; }
  .rest-icon { font-size: 64px; margin-bottom: 20px; }
  .rest-content h3 { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--muted); letter-spacing: 2px; margin-bottom: 10px; }
  .rest-content p { color: var(--muted); font-size: 14px; max-width: 360px; margin: 0 auto; line-height: 1.7; }
  .history-section { margin-top: 48px; }
  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1px; margin-bottom: 16px; color: var(--muted); }
  .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 10px; }
  .hist-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .hist-card .hw { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .hist-card .hdays { display: flex; gap: 4px; flex-wrap: wrap; }
  .hday { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; letter-spacing: .3px; }
  .hday.done { background: rgba(61,220,132,0.2); color: var(--green); }
  .hday.miss { background: rgba(255,255,255,0.04); color: var(--muted); }
  .hday.rest-day { background: rgba(107,107,136,0.08); color: rgba(107,107,136,0.4); }
  .hist-pct { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--accent); margin-top: 10px; }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--green); color: #000; padding: 12px 24px; border-radius: 100px; font-weight: 600; font-size: 14px; opacity: 0; transition: all .3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width:600px) {
    .ex-row { grid-template-columns: 28px 1fr auto auto; }
    .ex-stat:nth-child(4) { display: none; }
    .stats-bar { grid-template-columns: repeat(3,1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-block">
      <h1>IRON<span>WEEK</span></h1>
      <p>Chương trình tăng cơ · Người mới bắt đầu</p>
    </div>
    <div class="header-badges">
      <div class="badge highlight">6 buổi / tuần</div>
      <div class="badge">Gym đầy đủ thiết bị</div>
      <div class="badge">Tăng cơ · Tăng cân</div>
    </div>
  </header>
  <div class="stats-bar">
    <div class="stat-card"><div class="sv" id="s-total">0</div><div class="sl">Buổi đã tập</div></div>
    <div class="stat-card done-w"><div class="sv" id="s-week">0/6</div><div class="sl">Tuần này</div></div>
    <div class="stat-card streak"><div class="sv" id="s-streak">0</div><div class="sl">🔥 Streak (tuần)</div></div>
    <div class="stat-card"><div class="sv" id="s-avg">0%</div><div class="sl">Hoàn thành TB</div></div>
    <div class="stat-card"><div class="sv" id="s-weeks">0</div><div class="sl">Số tuần tập</div></div>
  </div>
  <div class="week-selector">
    <label>Tuần:</label>
    <button class="week-btn" id="prevWeek">◀</button>
    <div class="week-label" id="weekLabel">—</div>
    <button class="week-btn" id="nextWeek">▶</button>
    <button class="reset-week-btn" id="resetWeek">Reset tuần này</button>
  </div>
  <div class="week-bar" id="weekBar"></div>
  <div id="dayCards"></div>
  <div class="history-section">
    <div class="section-title">LỊCH SỬ TẬP LUYỆN</div>
    <div class="history-grid" id="historyGrid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SCHEDULE = [
  { day:'T2', label:'Thứ Hai',  focus:'Ngực & Vai trước',            tag:'tag-chest',    tagLabel:'Ngực · Vai',
    exercises:[
      {name:'Bench Press nằm ngang',      note:'Barbell / Máy Smith',         sets:4, reps:'8–10'},
      {name:'Dumbbell Incline Press',     note:'Ghế dốc 30–45°',              sets:3, reps:'10–12'},
      {name:'Cable Fly',                  note:'Máy cáp, ngang ngực',         sets:3, reps:'12–15'},
      {name:'Dumbbell Lateral Raise',     note:'Nâng tạ sang ngang',          sets:3, reps:'12–15'},
      {name:'Front Raise',                note:'Nâng tạ ra trước',            sets:3, reps:'12'},
    ],
    tips:['Ép vai xuống, lưng hơi cong tự nhiên khi bench press','Không khóa khuỷu tay khi duỗi thẳng','Hít vào trước khi đẩy, thở ra khi đẩy lên']
  },
  { day:'T3', label:'Thứ Ba',   focus:'Lưng & Biceps',               tag:'tag-back',     tagLabel:'Lưng · Biceps',
    exercises:[
      {name:'Lat Pulldown',               note:'Kéo xà xuống rộng tay',       sets:4, reps:'8–10'},
      {name:'Seated Cable Row',           note:'Kéo cáp ngồi hẹp tay',        sets:3, reps:'10–12'},
      {name:'Dumbbell Row',               note:'Bent-over, 1 tay',             sets:3, reps:'10–12'},
      {name:'Barbell Curl',               note:'Cuốn tạ đòn',                  sets:3, reps:'10–12'},
      {name:'Hammer Curl',                note:'Tạ đôi, tư thế búa',          sets:3, reps:'12'},
    ],
    tips:['Kéo lưng trước tay – cảm nhận cơ lưng co lại','Không đung đưa người khi curl','Giữ ngực thẳng, không gù lưng khi row']
  },
  { day:'T4', label:'Thứ Tư',   focus:'Chân – Quad trọng tâm',       tag:'tag-legs',     tagLabel:'Chân · Quad',
    exercises:[
      {name:'Squat (Barbell)',            note:'High bar hoặc Low bar',        sets:4, reps:'8–10'},
      {name:'Leg Press',                  note:'Máy leg press 45°',            sets:3, reps:'10–12'},
      {name:'Leg Extension',              note:'Cô lập cơ đùi trước',         sets:3, reps:'12–15'},
      {name:'Romanian Deadlift',          note:'RDL – tập cơ đùi sau',        sets:3, reps:'10–12'},
      {name:'Calf Raise (máy)',           note:'Đứng / ngồi đều được',        sets:4, reps:'15–20'},
    ],
    tips:['Squat xuống đến khi đùi song song sàn hoặc sâu hơn','Gối không vượt quá mũi bàn chân quá nhiều','Giữ lưng thẳng trong suốt RDL']
  },
  { day:'T5', label:'Thứ Năm',  focus:'Vai & Bẫy cổ',               tag:'tag-shoulder', tagLabel:'Vai · Bẫy cổ',
    exercises:[
      {name:'Overhead Press (OHP)',       note:'Barbell đứng hoặc ngồi',       sets:4, reps:'8–10'},
      {name:'Arnold Press',               note:'Tạ đôi, xoay cổ tay',          sets:3, reps:'10–12'},
      {name:'Lateral Raise (máy)',        note:'Máy lateral raise',            sets:3, reps:'12–15'},
      {name:'Rear Delt Fly',              note:'Máy pec deck reverse',         sets:3, reps:'12–15'},
      {name:'Barbell Shrug',              note:'Nhún vai, cơ bẫy cổ',         sets:3, reps:'12–15'},
    ],
    tips:['OHP: không ưỡn lưng quá mức, siết bụng','Lateral raise: nâng đến vai, không cao hơn','Rear delt: kéo bằng khuỷu tay, không bằng tay']
  },
  { day:'T6', label:'Thứ Sáu',  focus:'Ngực & Triceps',              tag:'tag-chest',    tagLabel:'Ngực · Triceps',
    exercises:[
      {name:'Incline Barbell Press',      note:'Ghế dốc 30°, ngực trên',       sets:4, reps:'8–10'},
      {name:'Dumbbell Flat Press',        note:'Nằm ngang, tạ đôi',            sets:3, reps:'10–12'},
      {name:'Triceps Pushdown',           note:'Cáp, thanh thẳng/V-bar',       sets:3, reps:'12–15'},
      {name:'Skull Crusher',              note:'EZ bar, nằm ngang',            sets:3, reps:'10–12'},
      {name:'Overhead Triceps Extension', note:'Tạ đơn hoặc cáp',             sets:3, reps:'12'},
    ],
    tips:['Incline press kéo ngực trên hiệu quả – đừng bỏ qua','Skull crusher: khuỷu cố định, chỉ cẳng tay di chuyển','Cuối buổi stretch ngực và triceps 5 phút']
  },
  { day:'T7', label:'Thứ Bảy',  focus:'Chân – Hamstring trọng tâm', tag:'tag-legs',     tagLabel:'Chân · Ham',
    exercises:[
      {name:'Romanian Deadlift nặng',     note:'Tập trung cơ đùi sau',         sets:4, reps:'8–10'},
      {name:'Leg Curl (máy)',             note:'Nằm hoặc ngồi',                sets:3, reps:'10–12'},
      {name:'Bulgarian Split Squat',      note:'Chân sau kê ghế',              sets:3, reps:'10 mỗi chân'},
      {name:'Hip Thrust (máy/tạ)',        note:'Cơ mông và đùi sau',          sets:3, reps:'12–15'},
      {name:'Calf Raise (đứng)',          note:'Tập nặng hơn thứ 4',          sets:4, reps:'15'},
    ],
    tips:['RDL nặng: kéo căng cơ đùi sau tối đa','Bulgarian squat: gối chân trước không vượt mũi chân','Hip thrust: siết mông ở đỉnh, giữ 1 giây']
  },
  { day:'CN', label:'Chủ Nhật', focus:'Nghỉ ngơi & Phục hồi', tag:'tag-rest', tagLabel:'Nghỉ ngơi', rest:true,
    tips:['Ngủ đủ 7–9 tiếng để cơ phục hồi tối đa','Bổ sung protein: 1.6–2.2g × kg cân nặng/ngày','Có thể đi bộ nhẹ hoặc stretching 20 phút','Uống đủ nước: 35–40ml × kg cân nặng/ngày']
  }
];
const STORE_KEY = 'ironweek_v2';
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
function save(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
function weekKey(offset) {
  const d = new Date(); d.setDate(d.getDate() + offset * 7);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const w = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(w).padStart(2,'0')}`;
}
let store = load(), weekOffset = 0, currentDay = 0;
function render() {
  const wk = weekKey(weekOffset);
  const wChecks = store[wk] || {};
  const [yr, wn] = wk.split('-W');
  document.getElementById('weekLabel').textContent = `TUẦN ${wn} · ${yr}`;
  const bar = document.getElementById('weekBar'); bar.innerHTML = '';
  SCHEDULE.forEach((d, i) => {
    const dc = wChecks[i] || {};
    const done = d.exercises ? Object.values(dc).filter(Boolean).length : 0;
    const complete = !d.rest && d.exercises && done >= d.exercises.length;
    const pill = document.createElement('button');
    pill.className = `day-pill${d.rest?' rest':''}${i===currentDay?' active':''}${complete?' completed':''}`;
    pill.textContent = d.day;
    pill.onclick = () => { currentDay = i; render(); };
    bar.appendChild(pill);
  });
  const area = document.getElementById('dayCards'); area.innerHTML = '';
  SCHEDULE.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = `day-card${i===currentDay?' visible':''}`;
    const dc = wChecks[i] || {};
    if (d.rest) {
      card.innerHTML = `<div class="day-header"><div class="day-number">0${i+1}</div><div class="day-info"><h2>${d.label.toUpperCase()}</h2><span class="muscle-tag ${d.tag}">${d.tagLabel}</span></div></div><div class="rest-content"><div class="rest-icon">😴</div><h3>NGHỈ NGƠI</h3><p>Cơ bắp phát triển khi bạn nghỉ, không phải khi tập. Hôm nay là ngày quan trọng nhất trong tuần!</p></div><div class="tips-box" style="margin-top:28px"><h4>💡 Lời khuyên phục hồi</h4><ul>${d.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
    } else {
      const total = d.exercises.length;
      const done = Object.values(dc).filter(Boolean).length;
      const pct = total ? Math.round(done/total*100) : 0;
      const full = done >= total;
      const rows = d.exercises.map((ex, ei) => {
        const chk = dc[ei] || false;
        return `<div class="ex-row${chk?' done':''}"><div class="ex-num">0${ei+1}</div><div class="ex-name">${ex.name}<small>${ex.note}</small></div><div class="ex-stat"><div class="val">${ex.sets}</div><div class="lbl">Sets</div></div><div class="ex-stat"><div class="val">${ex.reps}</div><div class="lbl">Reps</div></div><div class="ex-check${chk?' checked':''}" data-day="${i}" data-ex="${ei}" onclick="toggle(this)"></div></div>`;
      }).join('');
      card.innerHTML = `<div class="day-header"><div class="day-number">0${i+1}</div><div class="day-info"><h2>${d.label.toUpperCase()}</h2><span class="muscle-tag ${d.tag}">${d.tagLabel} · ${d.focus}</span></div><div class="complete-badge${full?' show':''}"><span>✓ Hoàn thành!</span></div></div><div class="progress-section"><div class="progress-label"><span>TIẾN ĐỘ BUỔI TẬP</span><span>${done} / ${total} bài</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="exercise-grid">${rows}</div><div class="tips-box"><h4>💡 Tips buổi hôm nay</h4><ul>${d.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
    }
    area.appendChild(card);
  });
  updateStats(); renderHistory();
}
function toggle(el) {
  const di = +el.dataset.day, ei = +el.dataset.ex;
  const wk = weekKey(weekOffset);
  if (!store[wk]) store[wk] = {};
  if (!store[wk][di]) store[wk][di] = {};
  const newVal = !store[wk][di][ei];
  store[wk][di][ei] = newVal;
  save(store);
  const d = SCHEDULE[di];
  if (newVal && d.exercises && d.exercises.every((_,j) => store[wk][di][j]))
    toast('🔥 Xong buổi ' + d.day + '! Tuyệt vời!');
  render();
}
function updateStats() {
  const allWks = Object.keys(store);
  let totalSess = 0, sumPct = 0, pctCount = 0;
  allWks.forEach(wk => {
    const wc = store[wk];
    SCHEDULE.forEach((d, i) => {
      if (d.rest) return;
      const dc = wc[i] || {};
      const done = Object.values(dc).filter(Boolean).length;
      if (done > 0) totalSess++;
      sumPct += d.exercises.length ? done/d.exercises.length*100 : 0;
      pctCount++;
    });
  });
  const wk = weekKey(weekOffset), wc = store[wk] || {};
  let thisW = 0;
  SCHEDULE.forEach((d,i) => { if(!d.rest && Object.values(wc[i]||{}).some(Boolean)) thisW++; });
  let streak = 0, off = 0;
  while (true) {
    const k = weekKey(off--);
    const wcc = store[k] || {};
    if (SCHEDULE.some((d,i) => !d.rest && Object.values(wcc[i]||{}).some(Boolean))) streak++;
    else break;
    if (Math.abs(off) > 60) break;
  }
  document.getElementById('s-total').textContent = totalSess;
  document.getElementById('s-week').textContent = thisW + '/6';
  document.getElementById('s-streak').textContent = streak;
  document.getElementById('s-avg').textContent = pctCount ? Math.round(sumPct/pctCount)+'%' : '0%';
  document.getElementById('s-weeks').textContent = allWks.length;
}
function renderHistory() {
  const grid = document.getElementById('historyGrid');
  const wks = Object.keys(store).sort().reverse().slice(0,12);
  if (!wks.length) { grid.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">Chưa có lịch sử. Bắt đầu tập để theo dõi!</div>'; return; }
  grid.innerHTML = wks.map(wk => {
    const wc = store[wk]; const [yr,wn] = wk.split('-W');
    let doneDays=0, totalDays=0;
    const days = SCHEDULE.map((d,i) => {
      if (d.rest) return `<div class="hday rest-day">${d.day}</div>`;
      totalDays++;
      const dc = wc[i]||{}, done=Object.values(dc).filter(Boolean).length;
      const full = done >= d.exercises.length;
      if (full) doneDays++;
      return `<div class="hday ${done>0?'done':'miss'}" title="${d.label}: ${done}/${d.exercises.length}">${d.day}</div>`;
    }).join('');
    const pct = totalDays ? Math.round(doneDays/totalDays*100) : 0;
    return `<div class="hist-card"><div class="hw">Tuần ${wn} · ${yr}</div><div class="hdays">${days}</div><div class="hist-pct">${pct}%</div></div>`;
  }).join('');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
document.getElementById('prevWeek').onclick = () => { weekOffset--; render(); };
document.getElementById('nextWeek').onclick = () => { weekOffset++; render(); };
document.getElementById('resetWeek').onclick = () => {
  if (!confirm('Reset toàn bộ tiến độ tuần này?')) return;
  delete store[weekKey(weekOffset)]; save(store);
  toast('Đã reset tuần này'); render();
};
render();
</script>
</body>
</html>
